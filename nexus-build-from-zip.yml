name: Compilar Nexus
on:
  push:
    paths: ['nexus-2.0-source.zip', '.github/workflows/nexus-build-from-zip.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -q nexus-2.0-source.zip -d nexus-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verificar arquivos originais
        working-directory: nexus-build/nexus-2.0
        run: python3 scripts/restore_upstream.py
      - name: Testar e compilar
        working-directory: nexus-build/nexus-2.0
        run: bash ./gradlew testDebugUnitTest lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-APK
          path: nexus-build/nexus-2.0/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nexus-relatorios
          path: nexus-build/nexus-2.0/**/build/reports/
          if-no-files-found: ignore
